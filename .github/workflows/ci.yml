name: CI

# Körs för pull requests mot main och anropas av deploy.yml vid push till main,
# så att samma kontroller alltid går före en publicering.
on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, tester och bygge
    runs-on: ubuntu-latest
    steps:
      - name: Hämta koden
        uses: actions/checkout@v7

      - name: Installera Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installera beroenden
        run: npm ci

      - name: Lint och typkontroll
        run: npm run lint

      - name: Enhetstester
        run: npm test

      - name: Installera Chromium för Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end-tester
        run: npm run e2e

      - name: Spara Playwright-rapport vid fel
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Bygg om med repots sökväg, eftersom GitHub Pages serverar appen under /<repo>/
      - name: Bygg för GitHub Pages
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # Bara när CI körs från deploy.yml på main, så att det är den testade
      # versionen som publiceras
      - name: Spara bygget för publicering
        uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
