name: Publicera

# Vid push till main körs först hela CI (ci.yml). Publiceringen startar bara
# om CI har gått igenom.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Avbryt inte en publicering som redan pågår, utan låt nästa vänta
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Publicera till GitHub Pages
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicera
        id: deployment
        uses: actions/deploy-pages@v5
